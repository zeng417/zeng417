name: Update latest blog posts

on:
  schedule:
    - cron: "0 1 * * *"   # 每天 UTC 01:00（北京时间 09:00）同步一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://zeng417.github.io/feed.xml"
          max_post_count: 3
          readme_path: "./README.md"
          comment_tag_name: "BLOG-POST-LIST"
          template: "- [$title]($url)"
